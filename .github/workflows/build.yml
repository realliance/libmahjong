name: Build libmahjong

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - next

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - toolchain: gcc
          - toolchain: clang
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: cachix/install-nix-action@v30
      - name: Build using Nix
        run: |
          nix build -L '.#${{ matrix.toolchain }}'
  test:
    name: Run ctests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Build using Nix
        run: |
          nix build -L '.#tests'
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: './result/test.xml'